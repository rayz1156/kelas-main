<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permainan · JomMain</title>
  <meta name="theme-color" content="#e2552d">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><p class="empty">Memuatkan permainan…</p></div>
  <noscript><p class="empty">Permainan ini memerlukan JavaScript.</p></noscript>
  <script type="module">
    import { boot } from './js/shell.js';
    boot().catch((err) => {
      console.error(err);
      document.getElementById('app').innerHTML = '<p class="empty">Maaf, permainan tidak dapat dimuatkan. <a href="./">Kembali ke laman utama</a></p>';
    });
  </script>
</body>
</html>
